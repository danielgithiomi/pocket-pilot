<section id="notification-dropdown" class="notification-dropdown" (click)="$event.stopPropagation()">
    <div class="notifications-arrow"></div>

    <div class="notifications-content">
        <div class="notifications-header">
            <p>Notifications</p>

            <div class="flex flex-row items-center gap-2">
                <div class="notifications-icon-wrapper">
                    @if (isMarkingAllAsRead()) {
                        <div class="icon-loader"></div>
                    } @else {
                        <lucide-icon
                            [size]="iconSize"
                            name="mark-as-read"
                            [img]="MarkAsReadIcon"
                            (click)="handleMarkAllAsRead()"
                            [ngClass]="{ 'bg-body-background text-primary' : isMarkingAllAsRead()}"
                        />
                    }
                </div>

                <div class="notifications-icon-wrapper">
                    <lucide-icon
                        name="close-icon"
                        [img]="CloseIcon"
                        [size]="iconSize"
                        class="notifications-icon"
                        (click)="closeNotificationsPanelEvent.emit()"/>
                </div>
            </div>
        </div>

        <div class="notifications-body">
            <atom-tab-list
                size="sm"
                [items]="tabListItems"
                [activeItem]="activeTabIndex()"
                wrapperClassName="!bg-body-background"
                (selectedIndex)="handleTabChange($event)"/>
        </div>

        <div class="notifications-footer">
            <p>View all notifications</p>
        </div>
    </div>
</section>
