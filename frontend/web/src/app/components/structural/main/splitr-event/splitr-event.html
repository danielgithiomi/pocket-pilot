<div [id]="splitrEvent().id" class="splitr-event group/event">
    <div class="splitr-event-content">
        <div class="splitr-event-details">
            <div class="splitr-event-info">
                <div class="splitr-event-info-left">
                    <p class="splitr-event-title">{{ splitrEvent().eventName }}</p>
                    <p class="splitr-event-date">{{ splitrEvent().eventDate }}</p>
                </div>

                <div class="splitr-event-info-right">
                    <p class="splitr-event-squad-name">{{ splitrEvent().verificationTotal }}</p>
                </div>
            </div>

            <div class="splitr-event-members">
                <div class="splitr-event-members-wrapper">
                    <atom-overlapper [items]="splitrEvent().eventMembers" />

                    <p class="splitr-event-members-count">
                        {{ splitrEvent().eventMembers.length }} people
                    </p>
                </div>

                <div class="splitr-event-tags">
                    <atom-badge variant="info" label="1 Payer" />
                    <atom-badge variant="warning" label="Settled" />
                </div>
            </div>
        </div>

        <div class="splitr-divider"></div>

        <div class="splitr-event-meals">
            <div class="splitr-event-meals">
                @for (splittable of splitrEvent().eventSplittables; track splittable.id) {
                    <atom-badge
                    variant="neutral"
                    [uppercase]="false"
                    className="cursor-default py-1.5"
                        [label]="splittable.name.toUpperCase() + ' x ' + splittable.quantity"
                    />
                }
            </div>
        </div>
    </div>

    <div class="splitr-event-pointer">
        <lucide-icon name="open-details-arrow" [img]="ArrowRght" [size]="16" />
    </div>
</div>
