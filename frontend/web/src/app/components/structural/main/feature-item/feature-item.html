<div [id]="featureId()" class="flex flex-row bg-alternate-background p-4 rounded-lg items-start gap-6 md:gap-4">

    <div class="flex flex-col items-center gap-2">
        <div class="size-8 grid place-items-center bg-body-background rounded border border-loader-primary">
            <lucide-icon name="upvote-icon" [size]="iconSize" [img]="UpVoteIcon" />
        </div>
        <p class="text-xs font-semibold text-reactive-text">{{ feature().featureScore }}</p>
    </div>

    <div class="flex-1 grow flex flex-col gap-2 overflow-hidden">
        <p class="text-sm font-semibold text-primary-text truncate-text">{{ feature().featureTitle }}</p>
        <p class="text-xs text-reactive-text truncate-text">{{ feature().featureContent }}</p>

        <div
            class="w-full flex flex-row md:flex-col lg:flex-row items-center md:items-start justify-between gap-4 md:gap-2">

            <div class="flex flex-row items-center gap-3">
                <div class="flex flex-row items-center pt-1 gap-1.5">
                    <lucide-icon name="comment-icon" [size]="iconSize" [img]="CommentIcon" class="text-reactive-text" />
                    <p class="text-xs font-semibold text-reactive-text">{{ feature().featureComments.length }}</p>
                </div>

                <div class="flex flex-row items-center gap-2">
                    <atom-badge [label]="feature().featureStatus" variant="info" />
                    <atom-badge [label]="feature().featureCategory" variant="neutral" />
                </div>
            </div>

            <div class="flex flex-row items-center gap-0.5 text-xs!">
                <p class="text-reactive-text">By:<span class="text-primary font-semibold">{{ feature().authorId }}</span></p>
                <span class="text-lg text-reactive-text">•</span>
                <p class="text-reactive-text">{{ formattedDate() }}</p>
            </div>

        </div>
    </div>
</div>
