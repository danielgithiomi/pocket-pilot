<div class="accordion" [ngClass]="wrapperClassName()" role="presentation">
    @for (item of items(); track trackItem($index, item)) {
        <article
            class="accordion-item"
            [class.accordion-item-expanded]="isExpanded($index)"
            [class.accordion-item-no-index]="!showIndex()"
        >
            <button
                type="button"
                class="accordion-trigger"
                [class.accordion-trigger-no-index]="!showIndex()"
                [attr.aria-expanded]="isExpanded($index)"
                [attr.aria-controls]="'accordion-panel-' + $index"
                (click)="toggleItem($index)"
            >
                @if (showIndex()) {
                    <span class="accordion-index" aria-hidden="true">
                        {{ formatIndex($index) }}
                    </span>
                }

                <span class="accordion-title">{{ item.title }}</span>

                <span
                    class="accordion-toggle"
                    [class.accordion-toggle-expanded]="isExpanded($index)"
                    aria-hidden="true"
                >
                    <lucide-icon
                        [size]="iconSize"
                        [img]="ChevronDown"
                        [name]="'accordion-chevron-' + $index"
                    />
                </span>
            </button>

            <div
                [id]="'accordion-panel-' + $index"
                class="accordion-panel"
                role="region"
                [attr.aria-hidden]="!isExpanded($index)"
                [@accordionContent]="isExpanded($index) ? 'expanded' : 'collapsed'"
            >
                <div class="accordion-content">
                    <p class="accordion-answer">{{ item.content }}</p>
                </div>
            </div>
        </article>
    }
</div>
