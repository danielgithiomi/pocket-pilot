<div [id]="statusId()" class="status" role="group" [attr.aria-label]="label()">
    @if (showLabel()) {
        <p class="status-label">{{ label() }}</p>
    }

    <ol class="status-track" role="list">
        @for (step of steps(); track step.id; let index = $index; let last = $last) {
            <li class="status-step" role="listitem" [attr.aria-current]="isStepCurrent(index, step) ? 'step' : null">
                <div class="status-icon-wrap" [ngClass]="iconWrapClass(index, step)">
                    <lucide-icon [size]="iconSize()" [img]="resolveStepIcon(index, step)" [name]="step.id" />
                </div>
                <span
                    class="status-name"
                    [class.status-name--active]="isStepNameActive(index, step)"
                    [class.status-name--error]="isStepNameError(index, step)">
                    {{ step.name }}
                </span>
            </li>

            @if (!last) {
                <li
                    class="status-connector"
                    role="presentation"
                    aria-hidden="true"
                    [class.status-connector--completed]="isConnectorCompleted(index, step)"></li>
            }
        }
    </ol>
</div>
