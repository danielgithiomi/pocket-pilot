<div [id]="statusId()" class="status" role="group" [attr.aria-label]="label()">
    @if (showLabel()) {
        <p class="status-label">{{ label() }}</p>
    }

    <ol class="status-track" role="list">
        @for (step of steps(); track step.id; let index = $index; let last = $last) {
            <li
                class="status-step"
                role="listitem"
                [attr.aria-current]="resolveStepState(index, step) === 'active' ? 'step' : null">
                <div class="status-node">
                    <div class="status-icon-wrap" [ngClass]="iconWrapClass(index, step)">
                        <lucide-icon
                            [size]="iconSize()"
                            [img]="resolveStepIcon(index, step)"
                            [name]="step.id"/>
                    </div>
                    <span class="status-name" [class.status-name--active]="resolveStepState(index, step) === 'active'">
                        {{ step.name }}
                    </span>
                </div>

                @if (!last) {
                    <div
                        class="status-connector"
                        [class.status-connector--completed]="isConnectorCompleted(index, step)"
                        aria-hidden="true"></div>
                }
            </li>
        }
    </ol>
</div>
