<section [id]="modalId()" class="modal">
    <div (click)="handleCloseModal('backdrop')" class="backdrop"></div>

    <div class="modal-content bg-inverted-background border-primary" [ngClass]="modalContentClasses()">
        @if (showCloseIcon()) {
            <div (click)="handleCloseModal('icon')" class="close-icon-wrapper group transition-custom">
                <lucide-icon
                    name="x"
                    [img]="X"
                    [size]="iconSize"
                    class="close-icon transition-custom"
                    [ngClass]="{ 'text-primary-text!': inverted() }"/>
            </div>
        }

        <!--    MODAL CONTENT HERE    -->
        <ng-content select="[slot=modal-content]"></ng-content>
    </div>
</section>
