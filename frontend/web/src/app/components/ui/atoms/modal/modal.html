<section [id]="modalId()" class="modal">
    <div (click)="handleCloseModal('backdrop')" class="backdrop"></div>

    <div
        class="modal-content bg-inverted-background border-primary"
        [ngClass]="modalContentClasses()">

        @if (showCloseIcon()) {
            <div class="close-icon-wrapper group">
                <lucide-icon
                    name="x"
                    [img]="X"
                    [size]="iconSize"
                    class="close-icon"
                    (click)="handleCloseModal('icon')"/>
            </div>
        }

        <!--    MODAL CONTENT HERE    -->
        <ng-content select="[slot=modal-content]"></ng-content>

    </div>
</section>
