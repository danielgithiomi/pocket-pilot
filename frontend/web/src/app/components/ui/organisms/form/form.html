<atom-modal
    [id]="modalId()"
    (onModalCloseEvent)="onFormCloseEvent.emit($event)"
    [closeModalOnBackdropClick]="onBackdropClickClose()"
    class="form-modal-wrapper">

    <div [id]="formId()" class="form" slot="modal-content">
        <!-- HEADER -->
        <div class="form-header">
            <div class="space-y-1">
                <p class="form-title">{{ title() }}</p>
                <p class="form-description">{{ description() }}</p>
            </div>
        </div>

        <!-- CONTENT -->
        <div class="form-content overflow-y-scroll no-scrollbar">
            <ng-content select="[slot=content]"></ng-content>
        </div>

        <!-- FOOTER -->
        <div class="form-footer">
            <ng-content select="[slot=sub-footer]"></ng-content>
            <ng-content select="[slot=footer]"></ng-content>
        </div>
    </div>
</atom-modal>
