<section id="splitwise-page" class="page">
  <div class="page-header">
    <h1 class="page-title">Splitwise</h1>

    <atom-button id="add-split" variant="primary" [disabled]="isLoadingResources()">
      <div class="w-full flex flex-row items-center justify-between gap-4">
        <lucide-icon name="create-split" [img]="Plus" [size]="iconSize"></lucide-icon>
        <span class="hidden sm:block">Add Split</span>
      </div>
    </atom-button>
  </div>

  <div class="page-container flex-1 space-y-4">
    <p class="page-subtitle">
      Keep track of <span class="font-semibold text-primary">shared</span> bills and expenses.
    </p>

    <div class="h-full flex flex-row gap-4">
      <!-- Left Side -->
      <div class="flex-3 bg-red-600"></div>

      <!-- Right Side -->
      <div class="flex-2 page-card">
        <splitwise-squads
          [isLoadingResources]="isLoadingResources()"
          [isCreateSquadFormOpen]="isCreateSquadFormOpen()"
          (createSquadButtonClickEvent)="isCreateSquadFormOpen.set(true)"
        />
      </div>
    </div>
  </div>
</section>

@if (isCreateSquadFormOpen()) {
  <splitwise-squard-form />
}
