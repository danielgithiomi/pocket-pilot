<div [id]="orderItemId()" class="order-item">
  <div class="order-item-header" (click)="isExpanded.set(!isExpanded())">
    <lucide-angular
      [size]="iconSize + 5"
      class="atom-icon text-inverted-text"
      [img]="isExpanded() ? ArrowUpIcon : ArrowDownIcon"
    />

    <div class="flex-1 flex flex-col space-y-1">
        <p class="order-item-name">{{ order().name }}</p>
        <p class="text-xs">{{ order().quantity }} x {{ formattedUnitPrice() }} = {{ formattedTotal() }}</p>
    </div>

    <atom-button
      type="button"
      variant="primary"
      id="remove-order-item"
      (clicked)="onDeleteClickEvent.emit(order().id)"
      className="w-fit bg-red-600 text-white text-xs shadow-none"
    >
      <div class="flex flex-row items-center justify-between gap-2">
        <lucide-icon [img]="DeleteIcon" [size]="iconSize" name="delete-order-item-icon" />
        <span class="hidden text-white! lg:block">Remove</span>
      </div>
    </atom-button>
  </div>
</div>
