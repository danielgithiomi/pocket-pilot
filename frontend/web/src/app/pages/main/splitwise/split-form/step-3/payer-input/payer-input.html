<div
    class="w-full flex flex-row items-center justify-between gap-4 p-4 shadow-lg rounded-lg cursor-default!"
>
    <div class="flex flex-row items-center gap-4">
        <!-- Avatar -->
        <div class="size-8 bg-primary rounded-full grid place-items-center">
            <p class="text-white font-semibold">{{ initial() }}</p>
        </div>

        <!-- Payer Name -->
        <p class="text-inverted-text text-sm font-semibold">{{ payer().payerName }}</p>
    </div>

    <div class="max-w-1/2 ml-auto flex flex-row items-center justify-end gap-2">
        <!-- Amount -->
        <div class="flex flex-row items-center gap-2 pr-4">
            <p class="text-xs font-semibold text-muted-text">{{ billingCurrency() }}</p>
            <input
                type="text"
                class="flex-1"
                numberStep="0.01"
                id="payer-amount"
                autocomplete="off"
                placeholder="0.00"
                #payerAmountInput
                (input)="handlePayerAmountChange(payerAmountInput.value)"
            />
        </div>

        <!-- Remove Payer -->
        <div
            (click)="onRemovePayerEvent.emit(payer().payerName)"
            class="ml-auto size-6 rounded grid place-items-center cursor-pointer"
        >
            <lucide-icon
                [size]="iconSize"
                name="delete-payer"
                [img]="DeleteIcon"
                class="text-inverted-text hover:text-error transition-all duration-300 cursor-pointer"
            />
        </div>
    </div>
</div>
