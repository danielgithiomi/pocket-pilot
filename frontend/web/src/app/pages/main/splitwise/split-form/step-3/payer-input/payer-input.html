<div class="w-full flex flex-row items-center gap-4">
    <!-- Avatar -->
    <div class="size-6 bg-primary rounded-full grid place-items-center">
        <p class="text-white">{{ initial() }}</p>
    </div>

    <!-- Payer Name -->
    <p class="text-inverted-text font-semibold">{{ payer() }}</p>

    <!-- Amount -->
    <div class="flex flex-row items-center gap-2">
        <p class="text-inverted-text">{{ defaultCurrency }}</p>
        <input
            type="text"
            class="flex-1"
            numberStep="0.01"
            id="payer-amount"
            autocomplete="off"
            placeholder="0.00"
            (input)="handlePayerAmountChange($event.target.value)"
        />
    </div>

    <!-- Remove Payer -->
</div>
