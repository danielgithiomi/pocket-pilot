<organism-form
  id="split"
  title="Log A New Split"
  (closeForm)="handleSplitFormClose($event)"
  description="Split shared expenses with your squad."
>
  <form id="split-form" slot="content" (submit)="handleSplitFormSubmit($event)">
    <split-form-step-1
      [iconSize]="iconSize"
      [formModel]="splitForm"
      [isSubmittingForm]="isSubmittingSplitForm()"
    />
  </form>

  <div class="w-full flex flex-row items-center justify-end gap-4" slot="footer">
    <atom-button
      type="button"
      label="Reset"
      form="split-form"
      [inverted]="true"
      variant="secondary"
      id="reset-split-form"
      (clicked)="resetSplitForm()"
      [disabled]="!splitForm().dirty() || isSubmittingSplitForm()"
    />

    @switch (splitFormStep()) {
      @case (1) {
        <atom-button
          type="button"
          variant="primary"
          id="to-splt-step-2"
          (clicked)="goToNextStep(2)"
          [disabled]="splitForm().invalid() || isSubmittingSplitForm()"
        >
          <div class="w-full flex flex-row items-center justify-between gap-4">
            <span>Next</span>
            <lucide-icon [img]="NextIcon" [size]="iconSize" name="next-goal-step" />
          </div>
        </atom-button>
      }
      @case (2) {
        <atom-button
          type="button"
          variant="primary"
          id="to-splt-step-3"
          (clicked)="goToNextStep(3)"
          [disabled]="splitForm().invalid() || isSubmittingSplitForm()"
        >
          <div class="w-full flex flex-row items-center justify-between gap-4">
            <span>Next</span>
            <lucide-icon [img]="NextIcon" [size]="iconSize" name="next-goal-step" />
          </div>
        </atom-button>
      }
      @case (3) {
        <atom-button
          type="submit"
          label="Submit"
          form="split-form"
          id="submit-split-form"
          [isLoading]="isSubmittingSplitForm()"
          [disabled]="splitForm().invalid() || isSubmittingSplitForm()"
        />
      }
    }
  </div>
</organism-form>
