<div class="flex flex-col h-full">
    <div class="card-header">
        <p class="title">Splitwise Events</p>
        <p class="subtitle">Manage your splitwise events</p>
    </div>

    <div class="card-content my-4 overflow-y-scroll no-scrollbar">
        <div class="flex flex-col gap-4">
            @for (event of splitrEvents(); track event.id) {
                <splitr-event [splitrEvent]="event" />
            }
        </div>
    </div>
</div>
