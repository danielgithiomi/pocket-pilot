<div id="faqs-features-page" class="page">
    <section id="faqs" class="page-section flex flex-col md:flex-row gap-4"
        [ngClass]="{ 'md:flex-col! lg:flex-row!': !drawerService.isDrawerCollapsed() }">

        <!-- LEFT SIDE START -->
        <div class="flex-3 min-h-full flex flex-col justify-around p-0 md:p-4">
            <div class="flex flex-col space-y-3 cursor-default!">
                <div class="w-fit rounded-xl px-2 py-1 bg-alternate-background border border-primary">
                    <p class="text-xs text-primary font-semibold shadow-xl">FAQs</p>
                </div>

                <h4 class="text-3xl md:text-4xl font-bold">Frequently Asked Questions!</h4>

                <div class="overflow-hidden w-3/4 mt-4">
                    <p class="overflow-hidden text-sm text-tertiary-dark text-ellipsis">
                        Find answers to common questions about Pocket Pilot and its features.
                    </p>
                </div>
            </div>

            <div class="flex flex-col space-y-4">
                @for (item of contactItems; track item.value) {
                <div class="w-fit flex flex-row items-center gap-2 group cursor-pointer hover:scale-[1.0025] transition-custom">
                    <div
                        class="size-8 grid place-items-center border group-hover:border-loader-primary bg-alternate-background rounded-lg transition-custom">
                        <lucide-icon [img]="item.icon" [size]="iconSize" [name]="item.id" />
                    </div>
                    <a [href]="item.link" class="text-sm group-hover:underline group-hover:text-primary transition-custom">{{
                        item.value }}</a>
                </div>
                }
            </div>
        </div>
        <!-- LEFT SIDE END -->

        <!-- RIGHT SIDE START -->
        <div class="flex-4 min-h-full p-0 md:p-4 mt-4">
            <div class="w-full min-h-3/4 p-6">
                <molecule-accordion id="faqs-accordion" [items]="faqItems" />
            </div>
        </div>
        <!-- RIGHT SIDE END -->
    </section>
</div>
