<section class="page" id="settings-page">
    <div class="page-header">
        <h1 class="page-title">Application Settings</h1>

        <atom-button (clicked)="handleOpenForm()" id="add-category" variant="primary">
            <div class="w-full flex flex-row items-center justify-between gap-4">
                <lucide-icon [img]="Plus" [size]="iconSize" name="create-category"></lucide-icon>
                <span class="hidden md:block">Add A Category</span>
            </div>
        </atom-button>
    </div>

    <div
        class="page-container flex-1 flex flex-col md:flex-row gap-6 md:gap-8"
        [ngClass]="{ 'md:flex-col! lg:flex-row! md:gap-8!': !drawerService.isDrawerCollapsed() }">
        <settings class="flex-1" />

        <categories (onAddCategoryClick)="handleOpenForm()" (onCategoryDelete)="deleteCategory($event)" class="flex-1" />
    </div>
</section>

@if (isCategoriesFormOpen()) {
    <categories-form (categoriesFormClosed)="handleCloseForm()" [isCategoriesFormOpen]="isCategoriesFormOpen()" />
}
