<section id="splitr-details-page" class="page">
    <div class="page-header">
        <h1 class="page-title">Splitr Event Details</h1>

        <atom-button
            variant="secondary"
            id="splitr-details-settle"
            [disabled]="isFetchingDetails()"
            (clicked)="handleOnSplittableSettledClick()"
        >
            <div class="w-full flex flex-row items-center justify-between gap-4">
                <lucide-icon name="settle-splittable" [img]="SettledIcon" [size]="iconSize" />
                <span class="hidden sm:block">Mark Settled</span>
            </div>
        </atom-button>
    </div>

    <div
        class="page-container flex-1 flex flex-col space-y-6"
        [ngClass]="{ 'grid! place-items-center!': !splittable }"
    >
        @if (!isFetchingDetails()) {
            <breadcrumbs
                [isLoading]="false"
                [icon]="BreadcrumbIcon"
                [breadcrumbItems]="breadcrumbItems()"
            />
        }

        <div
            class="h-full flex flex-col md:flex-row gap-6"
            [ngClass]="{
                'md:flex-col! lg:flex-row!': !drawerService.isDrawerCollapsed(),
            }"
        ></div>
    </div>
</section>
