<div class="splitr-summary h-full">
    <div class="card-header text-xl">
        <p class="title">Split Summary</p>
    </div>

    <div class="card-content">
        <div class="bg-muted-text cursor-default! rounded-lg p-4 my-4">
            <div class="flex flex-col gap-1 text-center">
                <p class="text-white">Grand Total</p>
                <p class="font-bold text-xl text-white">{{ formattedGrandTotal() }}</p>
            </div>
        </div>

        <hr />

        <div class="flex flex-col mt-4 space-y-3">
            @for (consumerSummary of consumerSummaries(); track consumerSummary.consumerName) {
                <consumer-summary [consumerData]="consumerSummary" [billingCurrency]="splitrEvent().billingCurrency" />
            }
        </div>
    </div>
</div>
