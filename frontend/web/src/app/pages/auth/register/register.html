<section class="flex flex-row min-h-screen" id="register">
    <div class="animate-left flex-1" id="form">
        <div class="form-wrapper">
            <div class="space-y-4">
                <h3>Hello there,</h3>
                <p>Create a new account to start using Pocket Pilot</p>
            </div>

            <!--   FORM START   -->
            <form (submit)="submitRegistrationForm($event)" id="register-form">
                <div class="w-full bg-red-600 flex flex-col md:flex-row gap-0 p-0 my-0!">
                    <atom-input
                        type="text"
                        id="firstname"
                        label="First Name"
                        placeholder="John"
                        autocomplete="name"
                        [formField]="registerForm.name"
                        (clearOutput)="registerForm.name().controlValue.set('')"/>

                    <atom-input
                        type="text"
                        id="lastname"
                        label="Last Name"
                        placeholder="Doe"
                        autocomplete="name"
                        [formField]="registerForm.name"
                        (clearOutput)="registerForm.name().controlValue.set('')"/>
                </div>

                <atom-input
                    id="email"
                    type="email"
                    autocomplete="email"
                    label="Email Address"
                    placeholder="johndoe@gmail.com"
                    [formField]="registerForm.email"
                    (clearOutput)="registerForm.email().controlValue.set('')" />

                <atom-input
                    id="password"
                    type="password"
                    label="Password"
                    placeholder="••••••••"
                    autocomplete="new-password"
                    [formField]="registerForm.password" />

                <atom-input
                    type="password"
                    id="confirm-password"
                    placeholder="••••••••"
                    label="Confirm Password"
                    autocomplete="new-password"
                    [formField]="registerForm.confirmPassword" />

                <atom-button
                    id="register"
                    type="submit"
                    label="Register"
                    form="register-form"
                    [isLoading]="isSubmitting()"
                    [disabled]="registerForm().invalid() || isSubmitting()" />
            </form>
            <!--   FORM END   -->

            <p (click)="routeToLogin()" class="form-redirect-text">Already have an account? Log in</p>

            <div class="secure-auth">
                <hr />
                <p class="text-muted-text capitalize">Secure Registration</p>
                <hr />
            </div>
        </div>
    </div>

    <auth-branding class="flex-1 hidden md:block animate-right" contentAlign="right" />
</section>
